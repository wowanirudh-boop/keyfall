    <title>Waterfall scale spike</title>
    <link rel="stylesheet" href="/spikes/waterfall/style.css" />

  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">T00 / S-1</p>
          <h1>Waterfall scale spike</h1>

          <a href="?strategy=full">A: full layer</a>

    <script type="module" src="/spikes/waterfall/main.ts"></script>
